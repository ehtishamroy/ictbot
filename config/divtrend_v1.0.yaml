# DIVTREND v1.0 — diversified time-series momentum, vol-scaled.
# Pre-registered: docs/spec/PREREG_DIVTREND_v1.0.md (locked before tuning).

strategy:
  name: DIVTREND
  version: "1.0"
  instrument: BASKET
  status: UNTESTED

# --- Free parameters. cap 6, using 4 (kept minimal; every knob inflates PBO). ---
free_params:
  lookback_months:   {default: 12, range: [6, 12],   def_id: DEF-TSMOM-01}
  skip_recent_month: {default: 1,  range: [0, 1],    def_id: DEF-TSMOM-01}
  vol_lookback_days: {default: 60, range: [20, 120], def_id: DEF-VOLSCALE-01}
  rebal_band:        {default: 0.1, range: [0.0, 0.3], def_id: turnover}

# --- Fixed constants (risk preferences / estimators — NOT edge levers). ---
fixed:
  target_vol_inst: 0.10      # per-instrument annualized risk target
  target_vol_port: 0.10      # portfolio annualized vol target
  max_inst_weight: 1.5       # per-instrument gross cap (pre portfolio scaling)
  max_sleeve_gross: 0.40     # each sleeve <= 40% of total gross
  k_max: 3.0                 # max portfolio leverage multiplier
  trading_days_year: 252
  month_days: 21             # trading days per lookback month

# --- Costs (per-instrument, on traded weight delta; bps of notional). ---
backtest:
  default_cost_bps: 3.0      # ETF round-trip ~ spread+commission; override per-instrument
  cost_stress_multipliers: [1.5, 2.0]
  is_frac: 0.70              # chronological IS/OOS
  gates:
    oos_sharpe_min: 0.40
    stability_ratio: 0.5     # OOS Sharpe >= 0.5 * IS Sharpe
    max_dd_pct_max: 35.0
